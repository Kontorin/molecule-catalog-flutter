name: molecule_catalog_flutter
description: "Каталог молекул и механизмов действия на Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  go_router: ^18.0.2
  dio: ^5.11.1
  json_annotation: ^4.12.0
  flutter_svg: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  json_serializable: ^6.15.2

flutter:
  generate: true
  uses-material-design: true
